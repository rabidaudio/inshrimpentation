moq: true
moqHTTP2Address: :8892
moqHTTP3Address: :8892
moqQUICAddress: :8893
moqAllowOrigins: ["*"]

paths:
  cam:
    # NOTE: the native mediamtx rpiCamera code cannot be statically linked
    # and therefore cannot run on gokrazy
    # source: rpiCamera
    # rpiCameraWidth: 640
    # rpiCameraHeight: 480
    # rpiCameraFPS: 15
    # Instead, we bundle ffmpeg and use that
    # runOnDemand: ffmpeg -f v4l2 -i /dev/video0 -c:v libx264 -pix_fmt yuv420p -preset ultrafast -b:v 600k -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
